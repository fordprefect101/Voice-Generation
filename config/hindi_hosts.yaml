# Hindi Fish identity refs (Devanagari). Used by make_hindi_refs_parler.py / make_hindi_refs_indicf5.py
#
# ref_sample = exact words spoken in male_ref.wav / female_ref.wav (Fish --prompt-text).
# parler_description = Indic Parler-TTS voice brief (name the speaker: Rohit / Divya).

male:
  parler_speaker: Rohit
  parler_description: >
    Rohit speaks in a very expressive and animated tone, like chatting with a close friend,
    with lots of pitch variation, at a slightly fast, lively pace. His voice is warm.
    Very clear audio, recorded very close up, with no background noise.
  ref_sample: >
    अरे वाह, आ गए हम! ये है चोखी ढाणी। पता है, यहाँ की सबसे मज़ेदार बात क्या है?
    शाम होते ही पूरा गाँव जगमगा उठता है! चलो, आराम से घूमते हैं… कोई जल्दी नहीं।

female:
  parler_speaker: Divya
  parler_description: >
    Divya speaks in a very expressive and animated tone, curious and delighted,
    with lots of pitch variation and a rising pitch on questions, at a slightly fast,
    lively pace. Very clear audio, recorded very close up, with no background noise.
  ref_sample: >
    अरे, रुको रुको! ये तो सच में कमाल है। तो ये सिर्फ़ दिखावा नहीं है?
    हम्म… अच्छा, अब कालबेलिया डांस के बारे में बताओ ना, मुझे सच में जानना है!

# Bundled IndicF5 seed prompts (download from GitHub if missing). ref_text MUST match the wav.
indicf5_seeds:
  male:
    prompt_file: MAR_M_WIKI_00001.wav
    ref_text: >
      या प्रथाला एकोणीसशे पंचातर ईसवी पासून भारतीय दंड संहिताची धारा चारशे अठ्ठावीस
      आणि चारशे एकोणतीसच्या अन्तर्गत निषेध केला.
  female:
    prompt_file: PAN_F_HAPPY_00001.wav
    ref_text: >
      ਭਹੰਪੀ ਵਿੱਚ ਸਮਾਰਕਾਂ ਦੇ ਭਵਨ ਨਿਰਮਾਣ ਕਲਾ ਦੇ ਵੇਰਵੇ ਗੁੰਝਲਦਾਰ ਅਤੇ ਹੈਰਾਨ ਕਰਨ ਵਾਲੇ ਹਨ,
      ਜੋ ਮੈਨੂੰ ਖੁਸ਼ ਕਰਦੇ ਹਨ।

relationship: >
  M = guide / context. F = curiosity / reaction. Same travel-companion register as English hosts.
